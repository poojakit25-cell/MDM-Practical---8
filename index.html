<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-100">

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">

        <h2 class="text-2xl font-bold mb-5 text-center">
            Student Registration
        </h2>

        <form id="registrationForm">

            <!-- Name -->
            <label>Student Name</label>
            <input type="text" id="name"
                class="w-full border p-2 mb-3 rounded">

            <!-- Email -->
            <label>Email</label>
            <input type="text" id="email"
                class="w-full border p-2 mb-3 rounded">

            <!-- Password -->
            <label>Password</label>
            <input type="password" id="password"
                class="w-full border p-2 mb-3 rounded">

                 <button type="button"
        onclick="togglePassword()"
        id="toggleBtn"
        class="bg-gray-300 text-black p-2 rounded mb-4">
        Show
    </button><br>

            <!-- Mobile -->
            <label>Mobile Number</label>
            <input type="text" id="mobile"
                class="w-full border p-2 mb-4 rounded">

            <button type="submit"
                class="w-full bg-violet-500 text-white p-2 rounded">
                Register
            </button>

            <p id="message" class="mt-4 text-center"></p>

        </form>
    </div>


    <script>
        function togglePassword() {
    let passwordField = document.getElementById("password");
    let toggleBtn = document.getElementById("toggleBtn");

    if (passwordField.type === "password") {
        passwordField.type = "text";
        toggleBtn.innerHTML = "Hide";
    } else {
        passwordField.type = "password";
        toggleBtn.innerHTML = "Show";
    }
}

        document.getElementById("registrationForm").onsubmit = function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let mobile = document.getElementById("mobile").value;

            let message = document.getElementById("message");

            // Mandatory fields
            if (name == "" || email == "" || password == "" || mobile == "") {
                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Email validation
            if (!email.includes("@") || !email.includes(".")) {
                message.innerHTML = "Enter a valid email.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Password validation
            if (password.length < 6) {
                message.innerHTML = "Password must be at least 6 characters.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }
            if (!password.includes("@" || "#" || "$" || "%")) {
                message.innerHTML = "Password must contain at least one special character (@, #, $, %).";
                message.className = "mt-4 text-center text-indigo-800";
                return;
            }

            // Mobile validation
            if (mobile.length != 10 || isNaN(mobile)) {
                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Success
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center text-green-500";

        };

    </script>

</body>
</html>
